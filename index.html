  :root {
    --wella-red: #BA0C2F;
    --wella-bright: #FF2000;
    --wella-navy: #0a1628;
    --wella-navy-deep: #050b14;
    --wella-navy-soft: #142845;
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, 0.55);
    --ink-faint: rgba(255, 255, 255, 0.18);
    --paper: #f8f6f3;
    --card-w: 240px;
    --card-h: 400px;
    --card-spread: 200px;
  }
  @media (orientation: portrait) {
    :root { --card-w: 200px; --card-h: 340px; --card-spread: 140px; }
  }
  /* Adaptive: very small viewports */
  @media (max-height: 700px) {
    :root { --card-h: 340px; }
  }
  @media (max-height: 600px) {
    :root { --card-h: 300px; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--wella-navy-deep);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .atmos {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(20, 40, 69, 0.8), transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(186, 12, 47, 0.06), transparent 50%),
      linear-gradient(180deg, var(--wella-navy) 0%, var(--wella-navy-deep) 100%);
    z-index: 0;
  }
  .grid-bg {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.04;
    background-image:
      linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  /* TOP BAR */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 22px 36px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 50;
    pointer-events: none;
  }
  .brand-wella { display: flex; align-items: center; gap: 12px; }
  .brand-wella .logo-wella {
    width: 64px; height: 40px;
    background-image: var(--wella-logo);
    background-size: contain; background-position: left center; background-repeat: no-repeat;
  }
  .brand-wella .pro {
    font-size: 8px; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 500;
    border-left: 1px solid var(--ink-faint); padding-left: 12px;
  }
  .top-right { display: flex; align-items: center; gap: 16px; }
  .top-right .kp-mini {
    width: 90px; height: 24px;
    background-image: var(--kp-logo);
    background-size: contain; background-position: right center; background-repeat: no-repeat;
    opacity: 0.7;
  }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 8px; letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 500;
    padding-left: 14px; border-left: 1px solid var(--ink-faint);
  }
  .status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-faint);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status.active .dot {
    background: var(--wella-bright);
    box-shadow: 0 0 12px var(--wella-bright);
  }
  /* STAGE */
  .stage {
    position: fixed; inset: 0;
    display: grid;
    grid-template-rows: 11vh 1fr 30vh 7vh;
    align-items: center;
    z-index: 10;
    perspective: 2200px;
  }
  .familia-label {
    grid-row: 1;
    text-align: center;
    align-self: end;
    padding-bottom: 10px;
    font-weight: 200;
    font-size: clamp(10px, 1vw, 13px);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--ink-soft);
    transition: color 0.4s;
    white-space: nowrap;
  }
  .carousel-wrap {
    grid-row: 2;
    position: relative;
    width: 100vw; height: 100%;
    transform-style: preserve-3d;
  }
  .carousel {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
  }
  .card {
    position: absolute;
    top: 50%; left: 50%;
    width: var(--card-w); height: var(--card-h);
    margin-left: calc(var(--card-w) / -2);
    margin-top: calc(var(--card-h) / -2);
    background: var(--paper);
    border-radius: 4px;
    overflow: hidden;
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.04);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.5s, box-shadow 0.4s;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    will-change: transform, opacity;
  }
  .card .card-logo {
    position: absolute;
    top: 12px; left: 0; right: 0;
    height: 16px;
    background-image: var(--kp-logo);
    background-size: contain; background-position: center; background-repeat: no-repeat;
    filter: invert(1) brightness(0.18);
    opacity: 0.55;
    pointer-events: none;
  }
  .card .swatch-wrap {
    position: absolute;
    top: 30px; bottom: 36px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper);
    overflow: hidden;
  }
  .card img {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }
  .card .card-tono {
    position: absolute;
    bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--wella-navy);
    font-weight: 700;
    pointer-events: none;
  }
  .card.center {
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.7),
      0 0 50px rgba(186, 12, 47, 0.25),
      0 0 0 1px rgba(186, 12, 47, 0.5);
  }
  /* GUIDE CARDS - same dimensions as tone cards, content scales to fit */
  .card.guide {
    background: linear-gradient(160deg, var(--wella-navy-soft), var(--wella-navy));
    color: var(--ink);
  }
  .card.guide .card-logo { filter: none; opacity: 0.85; }
  .card.guide .swatch-wrap {
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    padding: 8px 14px;
    background: transparent;
    overflow: hidden;
  }
  .card.guide .guide-title {
    font-size: 9px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--wella-bright);
    font-weight: 700;
    margin-bottom: 10px;
    text-align: center;
  }
  .card.guide .guide-step {
    display: flex; gap: 7px; margin-bottom: 7px; align-items: flex-start;
  }
  .card.guide .step-num {
    font-size: 14px; font-weight: 800;
    color: var(--wella-red);
    line-height: 1.2; letter-spacing: -0.04em;
    flex-shrink: 0; width: 16px;
  }
  .card.guide .step-text {
    font-size: 9.5px; line-height: 1.35;
    color: var(--ink); font-weight: 400;
  }
  .card.guide .step-text strong { color: var(--wella-bright); font-weight: 600; }
  .card.guide .card-tono {
    color: var(--ink-soft);
    font-size: 8px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    bottom: 10px;
  }

  /* FAMILIAS card - listado vertical compacto */
  .card.guide .fam-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 5px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .card.guide .fam-row:last-child {
    border-bottom: none;
    margin-bottom: 0;
  }
  .card.guide .fam-name {
    font-size: 10px;
    font-weight: 700;
    color: var(--wella-bright);
    letter-spacing: 0.04em;
    margin-bottom: 1px;
  }
  .card.guide .fam-desc {
    font-size: 8.5px;
    color: var(--ink-soft);
    font-weight: 400;
    line-height: 1.25;
  }
  /* INFO BLOCK */
  .info {
    grid-row: 3;
    text-align: center;
    transition: opacity 0.4s;
    padding: 18px 36px 0;
    align-self: start;
    overflow: hidden;
  }
  .info-row-main {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(20px, 3vw, 50px);
  }
  .tono-num {
    font-weight: 800;
    font-size: clamp(46px, 6vw, 96px);
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--ink);
    text-shadow: 0 0 30px rgba(186, 12, 47, 0.3);
  }
  .tono-num .slash {
    color: var(--wella-red);
    font-weight: 200;
    margin: 0 -0.04em;
    font-size: 0.9em;
  }
  .tono-text-block { text-align: left; max-width: 45vw; }
  .tono-title {
    font-size: clamp(15px, 1.4vw, 19px);
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink);
    line-height: 1.2;
  }
  .tono-subtitle {
    margin-top: 4px;
    font-size: clamp(10px, 0.85vw, 12px);
    color: var(--ink-soft);
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .tono-combo {
    margin-top: 16px;
    padding: 10px 18px;
    border: 1px solid var(--ink-faint);
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    max-width: 90vw;
  }
  .tono-combo .combo-tag {
    font-size: 8px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--wella-bright);
    font-weight: 700;
    flex-shrink: 0;
  }
  .tono-combo .combo-text {
    font-size: clamp(11px, 0.9vw, 13px);
    color: var(--ink);
    font-weight: 400;
  }
  /* GUIDE INFO STATE */
  .info.is-guide .tono-num { display: none; }
  .info.is-guide .info-row-main { justify-content: center; }
  .info.is-guide .tono-text-block { text-align: center; max-width: 80vw; }
  .info.is-guide .tono-title {
    font-weight: 200;
    font-size: clamp(26px, 3.2vw, 50px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .info.is-guide .tono-title em {
    color: var(--wella-bright);
    font-style: normal;
    font-weight: 700;
  }
  .info.is-guide .tono-subtitle {
    margin-top: 10px;
    text-transform: none;
    letter-spacing: 0.02em;
    font-size: clamp(13px, 1.05vw, 16px);
    line-height: 1.4;
  }
  .info.is-guide .tono-combo { display: none; }
  /* HAND CURSOR */
  .hand-cursor {
    position: fixed;
    width: 60px; height: 60px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 80;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s;
    mix-blend-mode: screen;

TONOS.forEach((t, i) => {
  const card = buildCard(t, i);
  carouselEl.appendChild(card);
  cards.push(card);
});

let renderQueued = false;
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderCarousel();
    renderQueued = false;
  });
}

function renderCarousel() {
  const cs = getComputedStyle(document.documentElement);
  const spread = parseInt(cs.getPropertyValue('--card-spread'));

  cards.forEach((card, i) => {
    const offset = i - currentIndex;
    const abs = Math.abs(offset);

    if (abs > 4) {
      card.style.opacity = '0';
      card.style.pointerEvents = 'none';
      card.style.transform = `translate3d(${offset > 0 ? 1500 : -1500}px, 0, 0) scale(0.5)`;
      card.classList.remove('center');
      return;
    }

    const x = offset * spread;
    const z = -abs * 160;
    const rotY = offset * -22;
    const scale = abs === 0 ? 1.05 : Math.max(0.5, 1 - abs * 0.13);
    const opacity = abs === 0 ? 1 : Math.max(0.3, 1 - abs * 0.22);

    card.style.transform = `translate3d(${x}px, 0, ${z}px) rotateY(${rotY}deg) scale(${scale})`;
    card.style.opacity = opacity;
    card.style.zIndex = 100 - abs;
    card.style.pointerEvents = abs === 0 ? 'auto' : 'none';

    if (abs === 0) card.classList.add('center');
    else card.classList.remove('center');
  });

  const t = TONOS[currentIndex];
  const info = document.getElementById('info');
  const tonoNum = document.getElementById('tonoNum');
  const tonoTitle = document.getElementById('tonoTitle');
  const tonoSubtitle = document.getElementById('tonoSubtitle');
  const tonoCombo = document.getElementById('tonoCombo');
  const familiaLabel = document.getElementById('familiaLabel');

  if (t.is_guide) {
    info.classList.add('is-guide');
    if (t.guide_type === 'how') {
      familiaLabel.textContent = 'GUÍA · APLICACIÓN';
      tonoTitle.innerHTML = 'Cómo <em>aplicar</em>';
      tonoSubtitle.textContent = 'Mezcla 1:1 con Welloxon Perfect · Cabello seco · 30-40 min de revelado';
    } else if (t.guide_type === 'tech') {
      familiaLabel.textContent = 'TECNOLOGÍA · ME+';
      tonoTitle.innerHTML = 'Koleston <em>Perfect</em> ME+';
      tonoSubtitle.textContent = 'Innovación de +130 años en color · ME+ Dye · Pure Balance · 100% canas';
    } else {
      familiaLabel.textContent = 'PALETA · FAMILIAS';
      tonoTitle.innerHTML = '6 <em>familias</em> · 69 tonos en Uruguay';
      tonoSubtitle.textContent = 'De los naturales puros a los rubios extremos · Cada familia con su carácter';
    }
  } else {
    info.classList.remove('is-guide');
    familiaLabel.textContent = t.familia.toUpperCase();
    const [a, b] = t.tono.split('-');
    tonoNum.innerHTML = `${a}<span class="slash">/</span>${b}`;
    tonoTitle.textContent = t.title || '';
    tonoSubtitle.textContent = t.subtitle || '';
    tonoCombo.textContent = t.combo || '';
  }

  document.querySelectorAll('.filter-pill').forEach(p => {
    let activeFam;
    if (t.is_guide) {
      if (t.guide_type === 'how') activeFam = 'Cómo aplicar';
      else if (t.guide_type === 'tech') activeFam = 'Tecnología';
      else activeFam = 'Familias';
    } else activeFam = t.familia;
    p.classList.toggle('active', p.dataset.fam === activeFam);
  });
}

const filtersEl = document.getElementById('filters');
FAMILIAS_ALL.forEach(f => {
  const pill = document.createElement('div');
  pill.className = 'filter-pill';
  pill.dataset.fam = f;
  pill.textContent = f;
  filtersEl.appendChild(pill);
});

renderCarousel();

let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(queueRender, 100);
});

function go(delta) {
  currentIndex = Math.max(0, Math.min(TONOS.length - 1, currentIndex + delta));
  queueRender();
}

function getFamKey(item) {
  if (item.is_guide) {
    if (item.guide_type === 'how') return 'Cómo aplicar';
    if (item.guide_type === 'tech') return 'Tecnología';
    return 'Familias';
  }
  return item.familia;
}

function jumpToFamily(direction) {
  const currentFam = getFamKey(TONOS[currentIndex]);
  if (direction > 0) {
    for (let i = currentIndex + 1; i < TONOS.length; i++) {
      if (getFamKey(TONOS[i]) !== currentFam) {
        currentIndex = i; queueRender(); return;
      }
    }
  } else {
    let foundDiff = false, firstOfPrev = -1;
    for (let i = currentIndex - 1; i >= 0; i--) {
      if (!foundDiff && getFamKey(TONOS[i]) !== currentFam) {
        foundDiff = true; firstOfPrev = i;
      }
      if (foundDiff && getFamKey(TONOS[i]) !== getFamKey(TONOS[firstOfPrev])) {
        currentIndex = i + 1; queueRender(); return;
      }
    }
    if (firstOfPrev >= 0) { currentIndex = 0; queueRender(); }
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowUp') jumpToFamily(1);
  else if (e.key === 'ArrowDown') jumpToFamily(-1);
  else if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  } else if (e.key === 'c' || e.key === 'C') {
    document.getElementById('cam').classList.toggle('hidden');
  }
});

const cursor = document.getElementById('cursor');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const camEl = document.getElementById('cam');
const splash = document.getElementById('splash');

let smoothedHandX = null;
let smoothedHandY = null;
let isPinched = false;
let lastPinchTime = 0;
let scrollAccumulator = 0;
let lastFrameTime = performance.now();
let frameSkipCounter = 0;
let pendingCursorX = null, pendingCursorY = null;

// Onboarding state
let lastHandLostTime = performance.now();
let onboardingShown = false;
const HAND_GONE_THRESHOLD = 2500; // ms without hand to consider "new person"
const ONBOARDING_DURATION = 5500; // ms tooltip stays visible

// Pinch hold for zoom
let pinchStartTime = 0;
let pinchHoldTriggered = false;
let isInZoomMode = false;
const PINCH_HOLD_THRESHOLD = 400; // ms - distinguish tap from hold

function distance(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function startMediaPipe() {
  const scripts = [
    'https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js',
    'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js'
  ];
  let loaded = 0;
  scripts.forEach(src => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => { loaded++; if (loaded === scripts.length) initHands(); };
    s.onerror = () => { statusText.textContent = 'Modo manual'; };
    document.head.appendChild(s);
  });
}

function initHands() {
  if (typeof Hands === 'undefined') { statusText.textContent = 'Modo manual'; return; }
  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0,
    selfieMode: true,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5
  });
  hands.onResults(onResults);

  const camera = new Camera(camEl, {
    onFrame: async () => {
      frameSkipCounter++;
      if (frameSkipCounter % 2 === 0) {
        await hands.send({image: camEl});
      }
    },
    width: 320, height: 240
  });
  camera.start().then(() => {
    statusEl.classList.add('active');
    statusText.textContent = 'Detección activa';
    cursorAnimLoop();
  }).catch(err => {
    statusText.textContent = 'Cámara denegada · use teclado';
  });
}

function cursorAnimLoop() {
  if (pendingCursorX !== null) {
    cursor.style.left = pendingCursorX + 'px';
    cursor.style.top = pendingCursorY + 'px';
  }
  requestAnimationFrame(cursorAnimLoop);
}

function onResults(results) {
  const nowFrame = performance.now();
  const deltaSec = Math.min(0.1, (nowFrame - lastFrameTime) / 1000);
  lastFrameTime = nowFrame;

  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    cursor.classList.add('hidden');
    cursor.classList.remove('pinched', 'pinch-progress');
    smoothedHandX = null;
    smoothedHandY = null;
    scrollAccumulator = 0;
    setZoneIndicator(0);
    lastHandLostTime = nowFrame;
    // FAILSAFE: si estábamos en zoom y se perdió la mano, salir del zoom
    if (isInZoomMode || pinchHoldTriggered) {
      exitZoomMode();
      pinchHoldTriggered = false;
      isPinched = false;
    }
    return;
  }

  // Check if this is a "new" hand appearance after some absence
  const handGoneFor = nowFrame - lastHandLostTime;
  if (handGoneFor > HAND_GONE_THRESHOLD) {
    showOnboardingTooltip();
  }
  // Update lastHandLostTime continuously while hand is present (so absence threshold restarts)
  lastHandLostTime = nowFrame;

  cursor.classList.remove('hidden');
  // MediaPipe with maxNumHands:1 auto-selects most prominent hand
  const lm = results.multiHandLandmarks[0];
  const tip = lm[8];
  const handX = tip.x;
  const handY = tip.y;

  if (smoothedHandX === null) { smoothedHandX = handX; smoothedHandY = handY; }
  smoothedHandX = smoothedHandX * 0.5 + handX * 0.5;
  smoothedHandY = smoothedHandY * 0.5 + handY * 0.5;

  pendingCursorX = smoothedHandX * window.innerWidth;
  pendingCursorY = smoothedHandY * window.innerHeight;

  const pinchDist = distance(lm[4], lm[8]);
  const handSize = distance(lm[0], lm[9]);
  const pinchRatio = pinchDist / handSize;

  const pinchProgress = Math.max(0, Math.min(1, (0.55 - pinchRatio) / 0.20));
  if (pinchProgress > 0.4 && pinchProgress < 0.95) {
    cursor.classList.add('pinch-progress');
  } else {
    cursor.classList.remove('pinch-progress');
  }

  const wasPinched = isPinched;
  isPinched = pinchRatio < 0.45;

  if (isPinched) {
    cursor.classList.add('pinched');
    if (!wasPinched) {
      pinchStartTime = Date.now();
      pinchHoldTriggered = false;
    }
    const heldFor = Date.now() - pinchStartTime;
    if (heldFor > PINCH_HOLD_THRESHOLD && !pinchHoldTriggered) {
      pinchHoldTriggered = true;
      enterZoomMode();
    }
    if (pinchHoldTriggered) {
      const zoomProgress = Math.min(1, (heldFor - PINCH_HOLD_THRESHOLD) / 800);
      const targetScale = 1 + (zoomProgress * 0.4);
      applyZoomScale(targetScale);
    }
    setZoneIndicator(0);
    return;
  } else {
    cursor.classList.remove('pinched');
    if (wasPinched) {
      if (!pinchHoldTriggered) {
        if (Date.now() - lastPinchTime > 800) {
          lastPinchTime = Date.now();
          triggerPinchEffect();
        }
      } else {
        exitZoomMode();
      }
      pinchHoldTriggered = false;
    }
  }

  let speed = 0, zone = 0;
  if (smoothedHandX < 0.30) {
    const intensity = (0.30 - smoothedHandX) / 0.30;
    speed = -intensity * 7;
    zone = -1;
  } else if (smoothedHandX > 0.70) {
    const intensity = (smoothedHandX - 0.70) / 0.30;
    speed = intensity * 7;
    zone = 1;
  }
  setZoneIndicator(zone);

  scrollAccumulator += speed * deltaSec;
  while (scrollAccumulator >= 1) { go(1); scrollAccumulator -= 1; }
  while (scrollAccumulator <= -1) { go(-1); scrollAccumulator += 1; }
}

function setZoneIndicator(zone) {
  const l = document.getElementById('zoneLeft');
  const r = document.getElementById('zoneRight');
  if (l) l.style.opacity = zone === -1 ? '1' : '0';
  if (r) r.style.opacity = zone === 1 ? '1' : '0';
}

function triggerPinchEffect() {
  const center = document.querySelector('.card.center');
  if (center) {
    const currentTransform = center.style.transform;
    center.style.transition = 'transform 0.2s, box-shadow 0.2s';
    center.style.transform = currentTransform + ' scale(1.06)';
    center.style.boxShadow = '0 0 80px rgba(255, 32, 0, 0.7), 0 0 0 3px var(--wella-bright)';
    setTimeout(() => {
      center.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s';
      queueRender();
    }, 220);
  }
  const atmos = document.querySelector('.atmos');
  atmos.style.transition = 'filter 0.1s';
  atmos.style.filter = 'brightness(1.4)';
  setTimeout(() => {
    atmos.style.transition = 'filter 0.4s';
    atmos.style.filter = 'brightness(1)';
  }, 200);
}

document.getElementById('startBtn').addEventListener('click', () => {
  splash.classList.add('gone');
  document.getElementById('loadingMask').classList.add('hidden');
  startMediaPipe();
  setTimeout(() => {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }, 500);
});

TONOS.forEach(t => { if (t.url) { const i = new Image(); i.src = t.url; } });

setTimeout(() => {
  document.getElementById('loadingMask').classList.add('hidden');
}, 1500);


function buildZoomCard(t) {
  const card = document.createElement('div');
  card.className = 'zoom-card';
  if (t.is_guide) card.classList.add('guide');

  const logo = document.createElement('div');
  logo.className = 'zoom-card-logo';
  card.appendChild(logo);

  const wrap = document.createElement('div');
  wrap.className = 'zoom-card-img-wrap';

  if (t.is_guide) {
    if (t.guide_type === 'how') {
      wrap.innerHTML = `
        <div class="guide-title">Cómo aplicar</div>
        <div class="guide-step"><div class="step-num">1</div><div class="step-text"><strong>Mezclá 1:1</strong> con Welloxon Perfect · 1.9% toner · 6% canas · 9-12% aclarado</div></div>
        <div class="guide-step"><div class="step-num">2</div><div class="step-text"><strong>Aplicá</strong> sobre cabello seco, mecha por mecha desde la raíz</div></div>
        <div class="guide-step"><div class="step-num">3</div><div class="step-text"><strong>Tiempo</strong>: 30-40 min sin calor · 15-25 min con calor</div></div>
        <div class="guide-step"><div class="step-num">4</div><div class="step-text"><strong>Enjuagá</strong> y emulsioná con agua tibia · Lavá con shampoo Color</div></div>
      `;
    } else if (t.guide_type === 'tech') {
      wrap.innerHTML = `
        <div class="guide-title">Tecnología ME+</div>
        <div class="guide-step"><div class="step-num">●</div><div class="step-text"><strong>ME+ Dye</strong> reemplaza PPD y PTD · Reduce hasta 60× el riesgo de alergia</div></div>
        <div class="guide-step"><div class="step-num">●</div><div class="step-text"><strong>Pure Balance</strong> minimiza radicales libres al desactivar metales del cabello</div></div>
        <div class="guide-step"><div class="step-num">●</div><div class="step-text"><strong>Cobertura</strong> hasta 100% canas · Aclara hasta 5 niveles con Special Blonde</div></div>
        <div class="guide-step"><div class="step-num">●</div><div class="step-text"><strong>+7 años</strong> de investigación · 20+ patentes · Hasta 85% origen natural</div></div>
      `;
    } else {
      wrap.innerHTML = `
        <div class="guide-title">Las 6 familias</div>
        <div class="fam-row"><span class="fam-name">Pure Naturals</span><span class="fam-desc">Color natural puro · 100% canas</span></div>
        <div class="fam-row"><span class="fam-name">Rich Naturals</span><span class="fam-desc">Reflejos refinados · Sofisticación</span></div>
        <div class="fam-row"><span class="fam-name">Deep Browns</span><span class="fam-desc">Marrones profundos · Chocolate</span></div>
        <div class="fam-row"><span class="fam-name">Vibrant Reds</span><span class="fam-desc">Rojos expresivos · Cobre a violeta</span></div>
        <div class="fam-row"><span class="fam-name">Special Blonde</span><span class="fam-desc">Rubios extremos · 5 niveles</span></div>
        <div class="fam-row"><span class="fam-name">Special Mix</span><span class="fam-desc">Tonos puros mezcladores</span></div>
      `;
    }
  } else {
    const img = document.createElement('img');
    img.src = t.url;
    img.referrerPolicy = 'no-referrer';
    wrap.appendChild(img);
  }
  card.appendChild(wrap);

  const tono = document.createElement('div');
  tono.className = 'zoom-card-tono';
  if (t.is_guide) {
    tono.textContent = t.guide_type === 'how' ? 'Guía técnica' : (t.guide_type === 'tech' ? 'Innovación' : 'Paleta');
  } else {
    tono.textContent = t.tono.replace('-', '/');
  }
  card.appendChild(tono);
  return card;
}

function enterZoomMode() {
  if (isInZoomMode) return;
  isInZoomMode = true;
  const overlay = document.getElementById('zoomOverlay');
  if (!overlay) return;
  overlay.innerHTML = '';
  const t = TONOS[currentIndex];
  const zoomCard = buildZoomCard(t);
  zoomCard.classList.add('held');
  overlay.appendChild(zoomCard);
  overlay.offsetHeight; // force reflow
  overlay.classList.add('active');
  zoomCard.style.setProperty('--zoom-scale', '1');
}

function applyZoomScale(scale) {
  const overlay = document.getElementById('zoomOverlay');
  if (!overlay || !overlay.classList.contains('active')) return;
  const card = overlay.querySelector('.zoom-card');
  if (card) card.style.setProperty('--zoom-scale', scale);
}

function exitZoomMode() {
  if (!isInZoomMode) return;
  isInZoomMode = false;
  const overlay = document.getElementById('zoomOverlay');
  if (overlay) {
    overlay.classList.remove('active');
    setTimeout(() => {
      if (!isInZoomMode) overlay.innerHTML = '';
    }, 400);
  }
}

function showOnboardingTooltip() {
  const tip = document.getElementById('onboardingTooltip');
  if (!tip) return;
  tip.classList.add('visible');
  // hide after duration
  clearTimeout(window._onboardingTimeout);
  window._onboardingTimeout = setTimeout(() => {
    tip.classList.remove('visible');
  }, ONBOARDING_DURATION);
}

</script>
